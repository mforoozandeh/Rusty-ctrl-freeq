[package]
name = "ctrl-freeq-gui"
version = "0.1.0"
edition = "2024"
# eframe 0.36 and its graphics stack need 1.95; the library itself needs less.
rust-version = "1.95"
description = "Rusty-ctrl-freeq: desktop and browser interface for the ctrl-freeq pulse optimiser"
license = "Apache-2.0"
authors = ["Mohammadali Foroozandeh"]
repository = "https://github.com/mforoozandeh/Rusty-ctrl-freeq"
publish = false
# Two binaries, but only one is ever run by hand: the worker is loaded by the browser, not started from a shell.
default-run = "ctrl-freeq-gui"

[lib]
name = "ctrl_freeq_gui"
path = "src/lib.rs"

[[bin]]
name = "ctrl-freeq-gui"
path = "src/bin/app.rs"

# The browser build runs the optimisation in this, as a Web Worker.  It does nothing natively; Trunk builds it for
# wasm32.
[[bin]]
name = "ctrl-freeq-worker"
path = "src/bin/worker.rs"

[dependencies]
ctrl-freeq = { path = ".." }
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    # Without this eframe hands the app no storage, so the setup would not survive a restart: localStorage in the
    # browser, a file in the platform's app-data directory natively.
    "persistence",
    "wayland",
    "x11",
] }
egui_plot = "0.37"
log = "0.4"
serde = { version = "1", features = ["derive"] }
# Results cross the Web Worker boundary as JSON; without exact float parsing they come back an ULP off.
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Blob",
    "BlobPropertyBag",
    "DedicatedWorkerGlobalScope",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "MessageEvent",
    "Url",
    "Window",
    "Worker",
    "WorkerGlobalScope",
]

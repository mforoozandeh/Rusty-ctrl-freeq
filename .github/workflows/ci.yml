name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test --release
      # The sequential fallback is otherwise only compiled, for wasm32.
      - name: Test without the parallel feature
        run: cargo test --release --lib --no-default-features
      - name: Doc tests
        run: cargo test --release --doc

  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    name: wasm32 library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The library has to keep compiling for the browser: no filesystem, no clock, no OS entropy source.
      - name: Build
        run: cargo build --target wasm32-unknown-unknown
      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    env:
      # Only whether it compiles; lint cleanliness is the lint job's business.
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.87'
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets

  examples:
    name: examples converge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each example exits non-zero unless it reaches its target fidelity.
      - name: Single qubit, broadband inversion
        run: cargo run --release --example single_qubit
      - name: Two-qubit CNOT
        run: cargo run --release --example two_qubit_cnot
      - name: Dissipative inversion
        run: cargo run --release --example dissipative
      - name: Transmon iSWAP, two and three levels
        run: cargo run --release --example superconducting_iswap
      # Fails unless one thread and every thread give identical results.
      - name: Timing and determinism
        run: cargo run --release --example timing

  gui:
    name: gui, native and web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Clippy, native
        run: cargo clippy -p ctrl-freeq-gui --all-targets -- -D warnings
      - name: Clippy, wasm32
        run: cargo clippy -p ctrl-freeq-gui --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        run: cargo test -p ctrl-freeq-gui --release
      # A released binary: building Trunk from source would take longer than the rest of the job.
      - name: Install Trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin trunk
      - name: Web build
        run: trunk build --release --config gui/Trunk.toml
      - uses: actions/upload-artifact@v7
        with:
          name: rusty-ctrl-freeq-web
          path: gui/dist

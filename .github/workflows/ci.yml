name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test --release
      # The sequential fallback is otherwise only compiled, for wasm32.
      - name: Test without the parallel feature
        run: cargo test --release --lib --no-default-features
      - name: Doc tests
        run: cargo test --release --doc

  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    name: wasm32 library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The library has to keep compiling for the browser: no filesystem, no clock, no OS entropy source.
      - name: Build
        run: cargo build --target wasm32-unknown-unknown
      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    env:
      # Only whether it compiles; lint cleanliness is the lint job's business.
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.87'
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets

  examples:
    name: examples converge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each example exits non-zero unless it reaches its target fidelity.
      - name: Single qubit, broadband inversion
        run: cargo run --release --example single_qubit
      - name: Two-qubit CNOT
        run: cargo run --release --example two_qubit_cnot
      - name: Dissipative inversion
        run: cargo run --release --example dissipative
      - name: Transmon iSWAP, two and three levels
        run: cargo run --release --example superconducting_iswap
      # Fails unless one thread and every thread give identical results.
      - name: Timing and determinism
        run: cargo run --release --example timing
